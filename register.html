<!doctype html>
<!-- آخر-تحديث: 2026-08-10 18:32:17 -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DASiN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="corner-deco"></div>
  <div id="app">
    <header>
      <button id="langToggleBtn" data-i18n-toggle class="small-btn lang-btn"></button>
      <h1 style="margin-inline-start:auto" data-i18n="registerTitle"></h1>
    </header>

    <section id="registerForm">
      <input id="regStudentName" type="text" data-i18n-placeholder="regStudentNamePlaceholder" />
      <input id="regGuardianName" type="text" data-i18n-placeholder="regGuardianNamePlaceholder" />
      <input id="regGuardianEmail" type="email" data-i18n-placeholder="regGuardianEmailPlaceholder" />
      <input id="regGuardianPhone" type="tel" data-i18n-placeholder="regGuardianPhonePlaceholder" />
      <button id="submitRegBtn" data-i18n="submitRegBtn"></button>
      <p id="regMessage"></p>
    </section>
  </div>

  <script type="module" src="/src/register.js"></script>
</body>
</html>
