<!doctype html>
<!-- آخر-تحديث: 2026-08-10 19:09:25 -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DASiN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="corner-deco"></div>
  <div id="app">
    <header>
      <button id="langToggleBtn" data-i18n-toggle class="small-btn lang-btn"></button>
      <div id="statusBadge" class="badge badge-loading" data-i18n="statusConnecting"></div>
      <h1 style="margin-inline-start:auto">DASiN</h1>
    </header>

    <section id="loginView">
      <h2 data-i18n="loginTitle"></h2>
      <input id="email" type="email" data-i18n-placeholder="emailPlaceholder" />
      <input id="password" type="password" data-i18n-placeholder="passwordPlaceholder" />
      <button id="loginBtn" data-i18n="loginBtn"></button>
      <p id="loginError" class="error"></p>
    </section>

    <section id="dashboardView" hidden>
      <div class="card-row">
        <h2><span data-i18n="dashboardPrefix"></span> <span id="schoolName"></span></h2>
        <button id="logoutBtn" class="small-btn" data-i18n="logoutBtn"></button>
      </div>

      <nav class="category-tabs">
        <button data-category="personale">الموظفين</button>
        <button data-category="admin" class="active">الإدارة</button>
        <button data-category="okonomi">المالية</button>
        <button data-category="pedagogisk">الأكاديمي</button>
        <button data-category="kommunikasjon">التواصل</button>
        <button data-category="skoleoppsett">إعداد المدرسة</button>
        <button data-category="system">النظام</button>
      </nav>

      <!-- الموظفين — زي مدينة: Alle personer/Lærere/Ledelse/Pålogget nå/
           Roller og tilganger/Eiere. لسه معملناش UI لأي واحد منهم. -->
      <nav class="tabs" data-category-group="personale" hidden>
        <p class="muted">قريبًا: المعلمين، الأدوار والصلاحيات، الملاك، متصل الآن</p>
      </nav>

      <!-- الإدارة — زي مدينة: Elever/Foresatte/Søknader/Kontaktendringer -->
      <nav class="tabs" data-category-group="admin">
        <button data-tab="students" class="active" data-i18n="tabStudents"></button>
        <button data-tab="registrations" data-i18n="tabRegistrations"></button>
        <button data-tab="guardians">أولياء الأمور</button>
      </nav>

      <!-- المالية — زي مدينة: Oversikt/Elevbetalinger/Betalingsforespørsler/
           Kasse/Betalingslogg/Lønn/Innstillinger -->
      <nav class="tabs" data-category-group="okonomi" hidden>
        <button data-tab="finances" class="active">المالية العامة (Kasse)</button>
        <button data-tab="pricing">الإعدادات (خصم الإخوة)</button>
      </nav>

      <!-- الأكاديمي — زي مدينة: Klasser/Timeplan/Oppmøte/Fraværsmeldinger/
           Forberedelser/Planmaler/Planarkiv/Lekser/Elevnotater -->
      <nav class="tabs" data-category-group="pedagogisk" hidden>
        <button data-tab="attendance" class="active" data-i18n="tabAttendance"></button>
        <button data-tab="homework" data-i18n="tabHomework"></button>
        <button data-tab="notes">ملاحظات الطلاب</button>
      </nav>

      <!-- التواصل — زي مدينة: Meldinger/Meldingssenter/Kunngjøringer -->
      <nav class="tabs" data-category-group="kommunikasjon" hidden>
        <button data-tab="announcements" class="active">الإعلانات</button>
      </nav>

      <!-- إعداد المدرسة — زي مدينة: Programmer/Skolekalender/
           Møtereferater/Rapporter -->
      <nav class="tabs" data-category-group="skoleoppsett" hidden>
        <button data-tab="programs" class="active" data-i18n="tabPrograms"></button>
        <button data-tab="calendar">التقويم</button>
        <button data-tab="meetings">الاجتماعات</button>
      </nav>

      <!-- النظام — زي مدينة: Oversikt/Verktøy/Veiledning، وهنا كمان
           سجل الحذف والنشاط (معادل Slettelogg/Lærerinnsyn) -->
      <nav class="tabs" data-category-group="system" hidden>
        <button data-tab="deletions" class="active" data-i18n="tabDeletions"></button>
        <button data-tab="activity" data-i18n="tabActivity"></button>
      </nav>

      <div id="tabStudents" class="tabPanel">
        <div id="studentsList"></div>
      </div>

      <div id="tabRegistrations" class="tabPanel" hidden>
        <div id="registrationsList"></div>
      </div>

      <div id="tabAttendance" class="tabPanel" hidden>
        <select id="attClassSelect"></select>
        <input id="attDate" type="date" />
        <div id="attStudentsList"></div>
        <p id="attMessage"></p>
      </div>

      <div id="tabHomework" class="tabPanel" hidden>
        <select id="hwClassSelect"></select>
        <input id="hwTitle" type="text" data-i18n-placeholder="hwTitlePlaceholder" />
        <input id="hwDueDate" type="date" />
        <button id="hwAddBtn" data-i18n="hwAddBtn"></button>
        <div id="homeworkList"></div>
      </div>

      <div id="tabPrograms" class="tabPanel" hidden>
        <div id="programsList"></div>
        <h3 data-i18n="addProgramHeading"></h3>
        <input id="progName" type="text" data-i18n-placeholder="progNamePlaceholder" />
        <select id="progModel">
          <option value="member" data-i18n="progModelMember"></option>
          <option value="non_member" data-i18n="progModelNonMember"></option>
        </select>
        <input id="progPrice" type="number" data-i18n-placeholder="progPricePlaceholder" />
        <button id="progAddBtn" data-i18n="progAddBtn"></button>
      </div>

      <div id="tabPricing" class="tabPanel" hidden>
        <h3>إعدادات خصم الإخوة</h3>
        <label>خصم الطفل التاني (%)</label>
        <input id="discount2Input" type="number" max="18" />
        <label>خصم الطفل التالت فما فوق (%)</label>
        <input id="discount3Input" type="number" max="18" />
        <button id="saveSettingsBtn">حفظ الإعدادات</button>
        <p id="settingsMsg" class="muted"></p>

        <h3>فحص العائلات</h3>
        <button id="checkMismatchBtn" class="small-btn">فحص كل العائلات</button>
        <div id="mismatchList"></div>
      </div>

      <div id="tabGuardians" class="tabPanel" hidden>
        <div id="guardiansList"></div>
        <h3>إضافة ولي أمر</h3>
        <input id="gName" type="text" placeholder="الاسم الكامل" />
        <input id="gPhone" type="tel" placeholder="التليفون" />
        <input id="gEmail" type="email" placeholder="الإيميل" />
        <button id="gAddBtn">إضافة</button>
      </div>

      <div id="tabCalendar" class="tabPanel" hidden>
        <div id="calendarList"></div>
        <h3>إضافة حدث</h3>
        <input id="calDesc" type="text" placeholder="وصف الحدث" />
        <input id="calFrom" type="date" />
        <input id="calTo" type="date" />
        <button id="calAddBtn">إضافة</button>
      </div>

      <div id="tabAnnouncements" class="tabPanel" hidden>
        <div id="announcementsList"></div>
        <h3>إعلان جديد</h3>
        <input id="annTitle" type="text" placeholder="العنوان" />
        <textarea id="annBody" placeholder="النص" style="min-height:80px"></textarea>
        <button id="annAddBtn">نشر الإعلان</button>
      </div>

      <div id="tabMeetings" class="tabPanel" hidden>
        <div id="meetingsList"></div>
        <h3>محضر اجتماع جديد</h3>
        <input id="meetTitle" type="text" placeholder="عنوان الاجتماع" />
        <input id="meetDate" type="date" />
        <textarea id="meetMinutes" placeholder="المحضر" style="min-height:80px"></textarea>
        <button id="meetAddBtn">حفظ</button>
      </div>

      <div id="tabFinances" class="tabPanel" hidden>
        <div id="financesList"></div>
        <h3>قيد مالي جديد</h3>
        <input id="finDate" type="date" />
        <select id="finType">
          <option value="expense">مصروف</option>
          <option value="income">إيراد</option>
        </select>
        <input id="finAmount" type="number" placeholder="المبلغ" />
        <input id="finDesc" type="text" placeholder="الوصف" />
        <button id="finAddBtn">حفظ</button>
      </div>

      <div id="tabNotes" class="tabPanel" hidden>
        <select id="noteStudentSelect"></select>
        <textarea id="noteText" placeholder="الملاحظة" style="min-height:60px"></textarea>
        <button id="noteAddBtn">إضافة ملاحظة</button>
        <div id="notesListForStudent"></div>
      </div>

      <div id="tabDeletions" class="tabPanel" hidden>
        <div id="deletionsList"></div>
      </div>

      <div id="tabActivity" class="tabPanel" hidden>
        <div id="activityList"></div>
      </div>
    </section>

    <section id="parentView" hidden>
      <div class="card-row">
        <h2><span data-i18n="parentPortalPrefix"></span> <span id="parentSchoolName"></span></h2>
        <button id="parentLogoutBtn" class="small-btn" data-i18n="logoutBtn"></button>
      </div>
      <div id="childrenList"></div>
    </section>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
