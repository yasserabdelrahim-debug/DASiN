<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DASiN</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>DASiN</h1>
      <div id="statusBadge" class="badge badge-loading">جاري الاتصال...</div>
    </header>

    <section id="loginView">
      <h2>تسجيل الدخول</h2>
      <input id="email" type="email" placeholder="الإيميل" />
      <input id="password" type="password" placeholder="الباسورد" />
      <button id="loginBtn">دخول</button>
      <p id="loginError" class="error"></p>
    </section>

    <section id="dashboardView" hidden>
      <div class="card-row">
        <h2>لوحة <span id="schoolName"></span></h2>
        <button id="logoutBtn" class="small-btn">خروج</button>
      </div>

      <nav class="tabs">
        <button data-tab="students" class="active">الطلاب</button>
        <button data-tab="registrations">الطلبات</button>
        <button data-tab="attendance">الحضور</button>
        <button data-tab="homework">الواجبات</button>
        <button data-tab="programs">البرامج</button>
        <button data-tab="deletions">سجل الحذف</button>
        <button data-tab="activity">النشاط</button>
      </nav>

      <div id="tabStudents" class="tabPanel">
        <div id="studentsList"></div>
      </div>

      <div id="tabRegistrations" class="tabPanel" hidden>
        <div id="registrationsList"></div>
      </div>

      <div id="tabAttendance" class="tabPanel" hidden>
        <select id="attClassSelect"></select>
        <input id="attDate" type="date" />
        <div id="attStudentsList"></div>
        <p id="attMessage"></p>
      </div>

      <div id="tabHomework" class="tabPanel" hidden>
        <select id="hwClassSelect"></select>
        <input id="hwTitle" type="text" placeholder="عنوان الواجب" />
        <input id="hwDueDate" type="date" />
        <button id="hwAddBtn">إضافة واجب</button>
        <div id="homeworkList"></div>
      </div>

      <div id="tabPrograms" class="tabPanel" hidden>
        <div id="programsList"></div>
        <h3>إضافة برنامج جديد</h3>
        <input id="progName" type="text" placeholder="اسم البرنامج" />
        <select id="progModel">
          <option value="member">عضو (شهري)</option>
          <option value="non_member">غير عضو (سنوي)</option>
        </select>
        <input id="progPrice" type="number" placeholder="السعر" />
        <button id="progAddBtn">إضافة</button>
      </div>

      <div id="tabDeletions" class="tabPanel" hidden>
        <div id="deletionsList"></div>
      </div>

      <div id="tabActivity" class="tabPanel" hidden>
        <div id="activityList"></div>
      </div>
    </section>

    <section id="parentView" hidden>
      <div class="card-row">
        <h2>بوابة أولياء الأمور — <span id="parentSchoolName"></span></h2>
        <button id="parentLogoutBtn" class="small-btn">خروج</button>
      </div>
      <div id="childrenList"></div>
    </section>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
